<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketPulse — Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: #0f1117;
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrapper {
            text-align: center;
            max-width: 480px;
            padding: 40px 24px;
        }
        .icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(16, 185, 129, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .icon svg { width: 24px; height: 24px; stroke: #34d399; }
        .title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: #f9fafb;
            margin-bottom: 8px;
        }
        .desc { color: #6b7280; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            padding: 10px 24px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover { background: #2563eb; }
        .sub { margin-top: 16px; font-size: 12px; color: #4b5563; }
        .sub a { color: #60a5fa; text-decoration: none; }
        .sub a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                <polyline points="16 7 22 7 22 13"></polyline>
            </svg>
        </div>
        <p class="title">Live Dashboard</p>
        <p class="desc">
            The interactive options intelligence dashboard with real-time WebSocket
            data, broker switching, and live market signals is available on the
            modern frontend.
        </p>
        <a href="/" class="btn">Open Dashboard</a>
        <p class="sub">
            <a href="{% url 'profile' %}">Profile</a> &middot;
            <a href="{% url 'credentials' %}">Credentials</a> &middot;
            <a href="{% url 'logout' %}">Sign Out</a>
        </p>
    </div>
</body>
</html>
